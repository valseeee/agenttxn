name: Scoped GitHub integration
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  issues:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install .
      - name: Create, reconcile, compensate and close test Issues
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENTTXN_GITHUB_REPOS: ${{ github.repository }}
        run: |
          set -o pipefail
          python scripts/github_integration.py --repository "$GITHUB_REPOSITORY" --confirm-live-writes | tee GITHUB_INTEGRATION_RESULTS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scoped-github-validation
          path: GITHUB_INTEGRATION_RESULTS.txt
