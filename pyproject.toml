[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "agenttxn"
version = "0.5.0"
description = "Durable transaction semantics for AI agents performing real-world actions"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]
postgres = ["psycopg[binary]>=3.2,<4"]
[project.scripts]
agenttxn = "agenttxn.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
